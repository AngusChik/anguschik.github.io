<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>A.C. | Gallery</title>
    <meta
      name="description"
      content="An edge-to-edge gallery of selected images by A.C."
    />
    <link rel="stylesheet" href="./styles.css?v=gallery-viewer-1" />
  </head>
  <body data-page="gallery">
    <div class="site-frame">
      <header class="topbar">
        <a class="brand" href="./index.html" aria-label="A.C. home">A.C</a>
        <nav class="nav" aria-label="Primary">
          <a class="nav-link" href="./index.html">Home</a>
          <a class="nav-link" href="./about.html">About</a>
          <a class="nav-link" href="./work.html">Work</a>
          <a class="nav-link active" href="./gallery.html">Gallery</a>
        </nav>
      </header>

      <main class="page gallery-page">
        <div class="gallery-head reveal">
          <p class="eyebrow">Gallery</p>
          <h1>A floating index.</h1>
          <div class="hero-rule"></div>
        </div>

        <!--
          Photos live in ./images/ (web-optimized copies of the originals).
          To change one, swap its src and keep the width/height matched to the
          image's real pixel ratio so the masonry layout stays stable on load.
        -->
        <div class="gallery-grid reveal reveal-delay">
          <figure class="gallery-item">
            <button class="gallery-float" type="button" aria-label="Expand image 1 of 11" data-gallery-open>
              <img src="./images/dsc_8473.jpg" width="1200" height="801" alt="" loading="lazy" draggable="false" />
            </button>
          </figure>

          <figure class="gallery-item">
            <button class="gallery-float" type="button" aria-label="Expand image 2 of 11" data-gallery-open>
              <img src="./images/test15-6698.jpg" width="1200" height="812" alt="" loading="lazy" draggable="false" />
            </button>
          </figure>

          <figure class="gallery-item">
            <button class="gallery-float" type="button" aria-label="Expand image 3 of 11" data-gallery-open>
              <img src="./images/test15-5008.jpg" width="675" height="1200" alt="" loading="lazy" draggable="false" />
            </button>
          </figure>

          <figure class="gallery-item">
            <button class="gallery-float" type="button" aria-label="Expand image 4 of 11" data-gallery-open>
              <img src="./images/dsc_8506.jpg" width="1200" height="801" alt="" loading="lazy" draggable="false" />
            </button>
          </figure>

          <figure class="gallery-item">
            <button class="gallery-float" type="button" aria-label="Expand image 5 of 11" data-gallery-open>
              <img src="./images/pic-43.jpg" width="1200" height="851" alt="" loading="lazy" draggable="false" />
            </button>
          </figure>

          <figure class="gallery-item">
            <button class="gallery-float" type="button" aria-label="Expand image 6 of 11" data-gallery-open>
              <img src="./images/test11-6136.jpg" width="1200" height="772" alt="" loading="lazy" draggable="false" />
            </button>
          </figure>

          <figure class="gallery-item">
            <button class="gallery-float" type="button" aria-label="Expand image 7 of 11" data-gallery-open>
              <img src="./images/pic-46.jpg" width="1200" height="817" alt="" loading="lazy" draggable="false" />
            </button>
          </figure>

          <figure class="gallery-item">
            <button class="gallery-float" type="button" aria-label="Expand image 8 of 11" data-gallery-open>
              <img src="./images/test15-6287.jpg" width="1200" height="801" alt="" loading="lazy" draggable="false" />
            </button>
          </figure>

          <figure class="gallery-item">
            <button class="gallery-float" type="button" aria-label="Expand image 9 of 11" data-gallery-open>
              <img src="./images/test15a-2-20.jpg" width="1200" height="801" alt="" loading="lazy" draggable="false" />
            </button>
          </figure>

          <figure class="gallery-item">
            <button class="gallery-float" type="button" aria-label="Expand image 10 of 11" data-gallery-open>
              <img src="./images/test8-5286.jpg" width="1200" height="801" alt="" loading="lazy" draggable="false" />
            </button>
          </figure>

          <figure class="gallery-item">
            <button class="gallery-float" type="button" aria-label="Expand image 11 of 11" data-gallery-open>
              <img src="./images/pic-7.jpg" width="1200" height="801" alt="" loading="lazy" draggable="false" />
            </button>
          </figure>
        </div>
      </main>

      <footer class="footer">
        <p>&copy; <span data-year></span> A.C.</p>
        <p>Design &amp; Direction</p>
      </footer>
    </div>

    <div
      class="gallery-lightbox"
      role="dialog"
      aria-modal="true"
      aria-label="Expanded gallery image"
      data-gallery-lightbox
      hidden
    >
      <button class="gallery-lightbox-close" type="button" aria-label="Close expanded image" data-gallery-close>
        &times;
      </button>
      <button class="gallery-lightbox-arrow gallery-lightbox-prev" type="button" aria-label="Previous image" data-gallery-prev>
        &larr;
      </button>
      <figure class="gallery-lightbox-stage">
        <img alt="" draggable="false" data-gallery-image />
      </figure>
      <button class="gallery-lightbox-arrow gallery-lightbox-next" type="button" aria-label="Next image" data-gallery-next>
        &rarr;
      </button>
      <p class="gallery-lightbox-count" aria-live="polite" data-gallery-count></p>
    </div>

    <script src="./script.js?v=gallery-viewer-1"></script>
  </body>
</html>
